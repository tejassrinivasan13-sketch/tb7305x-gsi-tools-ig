name: TB-7305X overlay kernel test candidate

on:
  push:
    branches:
      - 'codex/ut-kernel-first-build'
    paths:
      - '.github/workflows/tb7305x-halium-overlay-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-overlay-candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out port configuration and stock DTB
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            porting/deviceinfo-tb7305x-arm64
            tb7305x-stock-exact.dtb

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ca-certificates cpio curl device-tree-compiler fakeroot flex git jq kmod libssl-dev libtinfo5 python3 python3-lib2to3 unzip wget xz-utils

      - name: Fetch UBports build tools and kernel sources
        run: |
          git clone --depth 1 https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools.git adaptation
          cp porting/deviceinfo-tb7305x-arm64 adaptation/deviceinfo
          cp tb7305x-stock-exact.dtb adaptation/
          cd adaptation
          ./build.sh -b "$RUNNER_TEMP/tb7305x-work" -o "$RUNNER_TEMP/tb7305x-out" -c
          test -d "$RUNNER_TEMP/tb7305x-work/downloads/android_kernel_lenovo_mt8765_P"

      - name: Build experimental kernel, overlay, and boot image
        run: |
          set -euo pipefail
          export TB7305X_STOCK_DTB="$GITHUB_WORKSPACE/tb7305x-stock-exact.dtb"
          kernel_src="$RUNNER_TEMP/tb7305x-work/downloads/android_kernel_lenovo_mt8765_P"
          find "$kernel_src/tools/dct" -name '*.py' -print0 | xargs -0 -r python3 -m lib2to3 -w -n
          python3 - "$kernel_src/tools/dct/DrvGen.py" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          lines = path.read_text().splitlines(keepends=True)
          index = 1 if lines and lines[0].startswith("#!") else 0
          compat = ("import builtins, string, configparser" + chr(10)
                    + "def cmp(a, b): return (a > b) - (a < b)" + chr(10)
                    + "builtins.cmp = cmp" + chr(10)
                    + "string.atoi = int" + chr(10)
                    + "string.atof = float" + chr(10)
                    + "_ConfigParser = configparser.ConfigParser" + chr(10)
                    + "def _permissive_config_parser(*args, **kwargs):" + chr(10)
                    + "    kwargs.setdefault('strict', False)" + chr(10)
                    + "    return _ConfigParser(*args, **kwargs)" + chr(10)
                    + "configparser.ConfigParser = _permissive_config_parser" + chr(10))
          lines.insert(index, compat)
          path.write_text("".join(lines))
          PY
          python3 - "$kernel_src/tools/dct/data/EintData.py" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          replacements = {
              "for (key, value) in list(map.items()):": "for (key, value) in map.copy().items():",
              "if key in list(EintData._mode_map.keys()):": "if key in EintData._mode_map:",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"expected converted EintData code not found: {old}")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          python3 - "$GITHUB_WORKSPACE/adaptation" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          scripts = list(root.rglob("build-kernel.sh"))
          if len(scripts) != 1:
              raise SystemExit(f"expected one build-kernel.sh, found {len(scripts)}")
          path = scripts[0]
          source = path.read_text()
          defconfig = 'make O="$OUT" $MAKEOPTS $deviceinfo_kernel_defconfig'
          if defconfig not in source:
              raise SystemExit("could not locate kernel defconfig command")
          fragment = defconfig + """
          "$KERNEL_DIR/scripts/config" --file "$OUT/.config" \\
              --enable DEVTMPFS --enable FHANDLE --enable SYSVIPC --enable NAMESPACES \\
              --enable UTS_NS --enable IPC_NS --enable USER_NS --enable PID_NS --enable NET_NS --enable VT --enable OF_OVERLAY
          make O="$OUT" olddefconfig
          """
          source = source.replace(defconfig, fragment, 1)
          compile = 'make O="$OUT" $MAKEOPTS -j$(nproc --all)'
          if compile not in source:
              raise SystemExit("could not locate kernel build command")
          source = source.replace(compile, compile + ' Image.gz modules dtbs', 1)
          marker = 'ls "$OUT/arch/$ARCH/boot/"*Image*'
          if marker not in source:
              raise SystemExit("could not locate built-image check")
          source = source.replace(marker, """
          # Keep only the stock base DTB in boot.img. The bootloader applies the
          # separately packaged mt8765_P overlay from dtbo.img exactly once.
          cat "$OUT/arch/arm64/boot/Image.gz" "$TB7305X_STOCK_DTB" > "$OUT/arch/arm64/boot/Image.gz-dtb"
          ls "$OUT/arch/$ARCH/boot/"*Image*
          """, 1)
          path.write_text(source)
          print(f"Patched {path}")
          PY
          cd "$GITHUB_WORKSPACE/adaptation"
          python3 - "$GITHUB_WORKSPACE/adaptation/build-tarball-mainline.sh" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          old = 'cp -av overlay/* "${dir}/"'
          new = 'if [ -d overlay ]; then cp -av overlay/. "${dir}/"; fi'
          if old not in source:
              raise SystemExit("could not locate optional overlay copy command")
          path.write_text(source.replace(old, new, 1))
          PY
          ./build.sh -b "$RUNNER_TEMP/tb7305x-work" -o "$RUNNER_TEMP/tb7305x-out"
          kernel_obj="$RUNNER_TEMP/tb7305x-work/downloads/KERNEL_OBJ"
          test -f "$kernel_obj/arch/arm64/boot/Image.gz-dtb"
          overlay_dtb="$kernel_obj/arch/arm64/boot/dts/mediatek/mt8765_P.dtb"
          base_dtb="$kernel_obj/arch/arm64/boot/dts/mediatek/mt6739.dtb"
          test -f "$overlay_dtb"
          test -f "$base_dtb"
          fdtoverlay -i "$TB7305X_STOCK_DTB" -o "$RUNNER_TEMP/tb7305x-overlay-merge-check.dtb" "$overlay_dtb"
          python3 - "$kernel_obj/.config" "$kernel_obj/arch/arm64/boot/Image.gz" "$kernel_obj/arch/arm64/boot/Image.gz-dtb" "$TB7305X_STOCK_DTB" <<'PY'
          import pathlib, sys
          config, image_gz, image_gz_dtb, stock_dtb = map(pathlib.Path, sys.argv[1:])
          lines = set(config.read_text().splitlines())
          required = [
              "CONFIG_ARM64=y", "CONFIG_COMPAT=y", "CONFIG_DEVTMPFS=y",
              "CONFIG_FHANDLE=y", "CONFIG_SYSVIPC=y", "CONFIG_NAMESPACES=y",
              "CONFIG_UTS_NS=y", "CONFIG_IPC_NS=y", "CONFIG_USER_NS=y",
              "CONFIG_PID_NS=y", "CONFIG_NET_NS=y", "CONFIG_VT=y",
              "CONFIG_MTK_DTBO_FEATURE=y", "CONFIG_PSTORE=y",
              "CONFIG_PSTORE_CONSOLE=y", "CONFIG_PSTORE_RAM=y",
          ]
          missing = [item for item in required if item not in lines]
          if missing:
              raise SystemExit("missing required kernel options: " + ", ".join(missing))
          gz = image_gz.read_bytes()
          combined = image_gz_dtb.read_bytes()
          if gz[:2] != bytes.fromhex("1f8b"):
              raise SystemExit("Image.gz is not gzip-compressed")
          if combined != gz + stock_dtb.read_bytes():
              raise SystemExit("Image.gz-dtb is not Image.gz plus the stock base DTB exactly once")
          print("PASS: ARM64/Halium kernel configuration")
          print("PASS: kernel image gzip header")
          print("PASS: boot image contains stock base DTB exactly once")
          PY
          mkdir -p "$GITHUB_WORKSPACE/tb7305x-overlay-test-candidate"
          cp "$RUNNER_TEMP/tb7305x-work/tmp/partitions/boot.img" "$GITHUB_WORKSPACE/tb7305x-overlay-test-candidate/"
          cp "$kernel_obj/arch/arm64/boot/Image.gz-dtb" "$GITHUB_WORKSPACE/tb7305x-overlay-test-candidate/"
          cp "$kernel_obj/arch/arm64/boot/dts/mediatek/mt6739.dtb" "$GITHUB_WORKSPACE/tb7305x-overlay-test-candidate/"
          cp "$overlay_dtb" "$GITHUB_WORKSPACE/tb7305x-overlay-test-candidate/"
          cp "$kernel_obj/.config" "$GITHUB_WORKSPACE/tb7305x-overlay-test-candidate/kernel.config"
          python3 - "$overlay_dtb" "$GITHUB_WORKSPACE/tb7305x-overlay-test-candidate/dtbo.img" <<'PY'
          import pathlib, struct, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          if data[:4] != bytes.fromhex("d00dfeed"):
              raise SystemExit("overlay output is not a flattened device tree")
          page = 2048
          header_size = 32
          entry_size = 32
          entries_offset = header_size
          data_offset = ((entries_offset + entry_size + page - 1) // page) * page
          total_size = data_offset + len(data)
          header = struct.pack(">8I", 0xd7b7ab1e, total_size, header_size, entry_size, 1, entries_offset, page, 0)
          entry = struct.pack(">8I", len(data), data_offset, 0, 0, 0, 0, 0, 0)
          dtbo_path = pathlib.Path(sys.argv[2])
          dtbo_path.write_bytes(header + entry + bytes(data_offset - header_size - entry_size) + data)
          packed = dtbo_path.read_bytes()
          magic, total, hdr, entsz, count, entoff, pagesz, version = struct.unpack_from(">8I", packed)
          size, dataoff, *_ = struct.unpack_from(">8I", packed, entoff)
          if magic != 0xd7b7ab1e or total != len(packed) or hdr != 32 or entsz != 32 or count != 1 or pagesz != page or version != 0:
              raise SystemExit("invalid DTBO image header")
          if dataoff % page or size != len(data) or packed[dataoff:dataoff + size] != data:
              raise SystemExit("invalid DTBO entry payload")
          PY
          cat > "$GITHUB_WORKSPACE/tb7305x-overlay-test-candidate/CHECKS.txt" <<'EOF'
          PASS: kernel configuration includes ARM64, Halium namespace/device nodes,
          MediaTek DTBO support, and pstore console options.
          PASS: Image.gz gzip header is valid.
          PASS: Image.gz-dtb contains the stock base DTB exactly once.
          PASS: device overlay applies to the stock DTB with fdtoverlay.
          PASS: DTBO header and payload are structurally consistent.
          PASS: generated boot.img has Android boot magic and fits the 16 MiB boot partition.
          EOF
          python3 - "$RUNNER_TEMP/tb7305x-work/tmp/partitions/boot.img" <<'PY'
          import pathlib, sys
          boot = pathlib.Path(sys.argv[1]).read_bytes()
          if not boot.startswith(b"ANDROID!") or len(boot) > 16 * 1024 * 1024:
              raise SystemExit("boot.img header or size check failed")
          print("PASS: boot.img header and 16 MiB partition size")
          PY
          cat > "$GITHUB_WORKSPACE/tb7305x-overlay-test-candidate/README.txt" <<'EOF'
          EXPERIMENTAL, UNFLASHED KERNEL TEST CANDIDATE
          boot.img contains the kernel, Halium startup files, and the stock
          TB-7305X base DTB only. dtbo.img contains the mt8765_P device overlay.
          The bootloader should apply the overlay once. This package has no
          system.img or rootfs.img and cannot start the Ubuntu Touch interface.
          Build checks are recorded in CHECKS.txt. The kernel source has known
          device-tree problems, so the images are untested on this tablet.
          Do not flash these files.
          EOF
          EOF
          sha256sum "$GITHUB_WORKSPACE/tb7305x-overlay-test-candidate/"* > "$GITHUB_WORKSPACE/tb7305x-overlay-test-candidate/SHA256SUMS.txt"
          ls -lh "$GITHUB_WORKSPACE/tb7305x-overlay-test-candidate"

      - name: Upload experimental overlay candidate
        uses: actions/upload-artifact@v4
        with:
          name: tb7305x-overlay-kernel-test-candidate
          path: tb7305x-overlay-test-candidate/
          retention-days: 30
